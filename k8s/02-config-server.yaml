apiVersion: v1
kind: ConfigMap
metadata:
  name: config-repo-files
  namespace: ecommerce
data:
  auth-service.properties: |
    server.port=8084

    server.error.include-message=always

    jwt.secret=00d23b30-8bd5-4cfa-935c-9305be24d5f7

    jwt.access-expiration=60000
    jwt.refresh-expiration=604800000

    spring.datasource.url=jdbc:h2:mem:authdb
    spring.datasource.driver-class-name=org.h2.Driver
    spring.datasource.username=sa
    spring.datasource.password=

    spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=true

    spring.h2.console.enabled=true
    spring.h2.console.path=/h2-console

    eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
    eureka.client.fetch-registry=true
    eureka.client.register-with-eureka=true
    eureka.instance.prefer-ip-address=true
  auth-service-docker.properties: |
    eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
  clientes-service.properties: |
    server.port=8083

    spring.datasource.url=jdbc:h2:mem:clientesdb
    spring.datasource.driver-class-name=org.h2.Driver
    spring.datasource.username=sa
    spring.datasource.password=

    spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=true

    spring.h2.console.enabled=true
    spring.h2.console.path=/h2-console

    eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
    eureka.client.fetch-registry=true
    eureka.client.register-with-eureka=true
    eureka.instance.prefer-ip-address=true
  clientes-service-docker.properties: |
    eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
  produtos-service.properties: |
    server.port=8081

    spring.datasource.url=jdbc:h2:mem:produtosdb
    spring.datasource.driver-class-name=org.h2.Driver
    spring.datasource.username=sa
    spring.datasource.password=

    spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=true

    spring.h2.console.enabled=true
    spring.h2.console.path=/h2-console

    eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
    eureka.client.fetch-registry=true
    eureka.client.register-with-eureka=true
    eureka.instance.prefer-ip-address=true
  produtos-service-docker.properties: |
    eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
  vendas-service.properties: |
    server.port=8082

    spring.datasource.url=jdbc:h2:mem:vendasdb
    spring.datasource.driver-class-name=org.h2.Driver
    spring.datasource.username=sa
    spring.datasource.password=

    spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=true

    spring.h2.console.enabled=true
    spring.h2.console.path=/h2-console

    eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
    eureka.client.fetch-registry=true
    eureka.client.register-with-eureka=true
    eureka.instance.prefer-ip-address=true
  vendas-service-docker.properties: |
    eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: config-server:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "native"
            - name: SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS
              value: "file:///config-repo"
          volumeMounts:
            - name: config-repo
              mountPath: /config-repo
          readinessProbe:
            httpGet:
              path: /produtos-service/docker
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config-repo
          configMap:
            name: config-repo-files
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: ecommerce
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
